<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Upload</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=Fira+Code:wght@400;500;600;700&family=Syne:wght@600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="page-shell">
      <header class="title-row">
        <div>
          <p class="eyebrow">Student register</p>
          <h1>Student Upload</h1>
        </div>
        <span id="studentCount" class="count-pill" aria-live="polite">0</span>
      </header>

      <section class="panel form-panel">
        <form id="studentForm" novalidate>
          <div class="field-grid">
            <div class="field-group">
              <label for="name">Full name</label>
              <input id="name" name="name" type="text" autocomplete="name" />
              <p id="nameError" class="error" aria-live="polite"></p>
            </div>

            <div class="field-group">
              <label for="matric">Matric number</label>
              <input id="matric" name="matric" type="text" inputmode="numeric" placeholder="23/024145123" />
              <p id="matricError" class="error" aria-live="polite"></p>
            </div>

            <div class="field-group">
              <label for="level">Level</label>
              <select id="level" name="level">
                <option value="">Choose level</option>
                <option value="100">100 Level</option>
                <option value="200">200 Level</option>
                <option value="300">300 Level</option>
                <option value="400">400 Level</option>
                <option value="500">500 Level</option>
                <option value="600">600 Level</option>
              </select>
              <p id="levelError" class="error" aria-live="polite"></p>
            </div>

            <div class="field-group">
              <label for="department">Department</label>
              <input id="department" name="department" type="text" list="departments" />
              <datalist id="departments">
                <option value="Computer Science"></option>
                <option value="Accounting"></option>
                <option value="Mass Communication"></option>
                <option value="Business Administration"></option>
                <option value="Economics"></option>
                <option value="Electrical Engineering"></option>
                <option value="Civil Engineering"></option>
                <option value="Psychology"></option>
                <option value="Medicine"></option>
                <option value="Biochemistry"></option>
              </datalist>
              <p id="departmentError" class="error" aria-live="polite"></p>
            </div>
          </div>

          <div class="form-actions">
            <button id="addStudentBtn" type="submit" class="primary-button">Add student</button>
          </div>
        </form>
      </section>

      <section class="panel register-panel">
        <div class="panel-head">
          <h2>Student register</h2>
          <div class="action-row">
            <button id="toggleNamesBtn" type="button" class="secondary-button">Done, show names</button>
            <button id="removeLastBtn" type="button" class="ghost-button" disabled>Remove last</button>
          </div>
        </div>

        <div id="emptyState" class="empty-state">
          <p>No students added yet.</p>
          <button id="sampleBtn" type="button" class="secondary-button">Add 3 sample students</button>
        </div>

        <div id="studentGrid" class="student-grid" aria-live="polite"></div>
      </section>

      <aside id="namesPanel" class="panel names-panel hidden" aria-live="polite">
        <h2>Student names</h2>
        <div id="namesList" class="names-list"></div>
      </aside>
    </main>

    <script src="script.js"></script>
  </body>
</html>
