<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Upload</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Fira+Code:wght@400;500;600;700&family=Syne:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="title-row">
        <h1>Student Upload</h1>
        <span class="count-pill" id="countPill" aria-live="polite">0</span>
      </header>

      <section class="panel form-panel" aria-label="Student form">
        <h2>Add Student</h2>
        <form id="studentForm" novalidate>
          <div class="field-grid">
            <div class="field-group">
              <label for="name">Full name</label>
              <input id="name" name="name" type="text" autocomplete="name" />
              <p class="error" id="nameError" aria-live="polite"></p>
            </div>

            <div class="field-group">
              <label for="matric">Matric number</label>
              <input id="matric" name="matric" type="text" placeholder="23/024145123" />
              <p class="error" id="matricError" aria-live="polite"></p>
            </div>

            <div class="field-group">
              <label for="level">Level</label>
              <select id="level" name="level">
                <option value="">Choose level</option>
                <option value="100">100 Level</option>
                <option value="200">200 Level</option>
                <option value="300">300 Level</option>
                <option value="400">400 Level</option>
                <option value="500">500 Level</option>
                <option value="600">600 Level</option>
              </select>
              <p class="error" id="levelError" aria-live="polite"></p>
            </div>

            <div class="field-group">
              <label for="department">Department</label>
              <input id="department" name="department" type="text" list="departmentList" />
              <datalist id="departmentList">
                <option value="Computer Science"></option>
                <option value="Accounting"></option>
                <option value="Mass Communication"></option>
                <option value="Law"></option>
                <option value="Medicine"></option>
                <option value="Engineering"></option>
                <option value="Business Administration"></option>
                <option value="Education"></option>
              </datalist>
              <p class="error" id="departmentError" aria-live="polite"></p>
            </div>
          </div>

          <button type="submit" class="primary-btn">Add student</button>
        </form>
      </section>

      <section class="panel register-panel" aria-label="Student register">
        <div class="panel-header">
          <h2>Student register</h2>
          <div class="button-row">
            <button type="button" id="toggleNamesBtn" class="secondary-btn">Done, show names</button>
            <button type="button" id="removeLastBtn" class="danger-btn" disabled>Remove last</button>
          </div>
        </div>

        <div id="statusMessage" class="status-message" aria-live="polite"></div>

        <div id="emptyState" class="empty-state">
          <p>No students added yet.</p>
          <button type="button" id="addSamplesBtn" class="secondary-btn">Add 3 sample students</button>
        </div>

        <div id="cardGrid" class="card-grid" aria-live="polite"></div>
      </section>

      <aside id="namesPanel" class="panel names-panel" aria-live="polite" hidden>
        <h2>Student names</h2>
        <div id="namesList" class="names-list"></div>
      </aside>
    </main>

    <script src="script.js"></script>
  </body>
</html>
